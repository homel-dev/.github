extends: default

ignore: |
  .git/
  .org-standards/
  node_modules/
  vendor/
  third_party/
  old/

rules:
  document-start: disable
  line-length: disable
  truthy: disable
  comments-indentation: disable
  indentation:
    indent-sequences: true
    ignore: |
      /clusters/*/flux-system/gotk-components.yaml
      /clusters/*/flux-system/kustomization.yaml
  comments:
    min-spaces-from-content: 1
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
